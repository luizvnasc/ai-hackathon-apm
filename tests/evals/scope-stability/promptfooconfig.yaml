# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: scope-stability skill evals
# Two providers share one agent setup and differ only in the environment:
#   unconfigured - credentials blank: routing tests and the NOT CONFIGURED path.
#   configured   - fake credentials; the scripts' HTTP layer is mocked by ../mock/sitecustomize.py
#                  and answers from the shared fixtures/, so reports have known numbers.
#                  EVAL_DATASET_DATE is the date the dataset was written for; the mock shifts every
#                  fixture date so that date becomes the real today (the agent and the script then
#                  agree on "today" and the numbers never drift). The mock covers only Python's
#                  urlopen; containment comes from sandbox/run.py, the only way to run this
#                  config (working_dir does not exist elsewhere). See tests/README.md.
providers:
  - id: anthropic:claude-agent-sdk
    label: unconfigured
    config: &agent
      working_dir: /sandbox/tests/evals/.workspace   # exists only in sandbox/run.py's container
      setting_sources: ['project']
      skills: 'all'
      append_allowed_tools: ['Read', 'Bash', 'mcp__hackathon-metrics__team_velocity', 'mcp__hackathon-metrics__commitment_delivered', 'mcp__hackathon-metrics__scope_stability', 'mcp__hackathon-metrics__delivery_quality', 'mcp__hackathon-metrics__stale_issues', 'mcp__hackathon-metrics__blocked_issues', 'mcp__hackathon-metrics__assign_issues', 'mcp__hackathon-metrics__populate_project']
      # The package's MCP server, from the same place as in a user's project (see sync-skills.sh)
      mcp:
        enabled: true
        servers:
          - name: hackathon-metrics
            command: python3
            args: ['apm_modules/luizvnasc/ai-hackathon-apm/mcp/server.py']
      disallowed_tools: ['Write', 'Edit', 'WebFetch', 'WebSearch']
      max_turns: 8
      max_budget_usd: 0.5
      apiKeyRequired: false
      model: haiku
      env:
        GITLAB_URL: ''
        GITLAB_TOKEN: ''
        PLANE_URL: ''
        PLANE_WORKSPACE: ''
        PLANE_API_KEY: ''
  - id: anthropic:claude-agent-sdk
    label: configured
    config:
      <<: *agent
      env:
        GITLAB_URL: http://gitlab.mock
        GITLAB_TOKEN: glpat-eval-fake
        PLANE_URL: http://plane.mock
        PLANE_WORKSPACE: eval
        PLANE_API_KEY: plane-eval-fake
        PYTHONPATH: '{{ env.PWD }}/.workspace/mock'
        EVAL_FIXTURES: '{{ env.PWD }}/.workspace/fixtures'
        EVAL_DATASET_DATE: '2026-11-12'
        EVAL_PLANE_NO_ESTIMATES: '1'   # Plane CE as released (makeplane/plane#9933)

prompts:
  - '{{request}}'

# Grader for llm-rubric: a tool-less agent, so it also works with the local Claude Code login.
defaultTest:
  options:
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        model: haiku
        custom_allowed_tools: []
        max_turns: 1
        max_budget_usd: 0.1

tests:
  # Fixtures (shared dataset, dataset date 2026-11-12, shifted to the real today; Plane INV and GitLab group/inv agree):
  #   initial / added / removed / re-estimated / stability:
  #   S1 13/2/2/0/69%, S2 10/8/2/0/0%, S3 4/10/2/0/0%, S4 2/8/0/0/0%, S5 (current) 16/2/0/1/81%.
  #   S1: issue 4 was cancelled on the start day, so it is planning. S5: issue 18 entered with 2, re-estimated to 3.
  #   Median of S1-S4: 0%, unstable, getting less stable.
  - description: triggers on scope stability of a milestone (en)
    providers: [configured]
    vars: {request: "What is the scope stability of milestone Sprint 1 of group/inv in GitLab?"}
    assert:
      - type: skill-used
        value: scope-stability
      - type: javascript
        value: |
          const o = String(output);
          const rounds = (text, n, percent) => [...text.matchAll(percent ? /(\d+(?:[.,]\d+)?)\s?%/g : /(?<![\d.,])(\d+(?:[.,]\d+)?)/g)]
            .some(m => Math.round(Number(m[1].replace(',', '.'))) === n);  // 90,6 says 91: the agent may quote the JSON
          return rounds(o, 69, true) && /unstable/i.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);

  - description: triggers on how much the cycle changed (en)
    providers: [configured]
    vars: {request: "How much has the current cycle of Plane project INV changed since it started?"}
    assert:
      - type: skill-used
        value: scope-stability
      - type: javascript
        value: |
          const o = String(output);
          const rounds = (text, n, percent) => [...text.matchAll(percent ? /(\d+(?:[.,]\d+)?)\s?%/g : /(?<![\d.,])(\d+(?:[.,]\d+)?)/g)]
            .some(m => Math.round(Number(m[1].replace(',', '.'))) === n);  // 90,6 says 91: the agent may quote the JSON
          return rounds(o, 81, true) && /Sprint 5/.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer says Sprint 5 is still running (partial), with 81% stability or 19% change, and does not present a delivery or say/do ratio as the stability.

  - description: triggers on estabilidade de escopo (pt)
    providers: [configured]
    vars: {request: "Qual a estabilidade de escopo da Sprint 1 do projeto INV no Plane?"}
    assert:
      - type: skill-used
        value: scope-stability
      - type: javascript
        value: |
          const o = String(output);
          const rounds = (text, n, percent) => [...text.matchAll(percent ? /(\d+(?:[.,]\d+)?)\s?%/g : /(?<![\d.,])(\d+(?:[.,]\d+)?)/g)]
            .some(m => Math.round(Number(m[1].replace(',', '.'))) === n);  // 90,6 says 91: the agent may quote the JSON
          return rounds(o, 69, true) && /inst[áa]vel|unstable/i.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);

  - description: triggers on what entered and left (pt)
    providers: [configured]
    vars: {request: "O que entrou e saiu da Sprint 2 do group/inv no GitLab depois que ela começou?"}
    assert:
      - type: skill-used
        value: scope-stability
      - type: javascript
        value: |
          const o = String(output);
          return /#6\b/.test(o) && /#12\b/.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);

  - description: triggers on scope creep (en)
    providers: [configured]
    vars: {request: "Do we have scope creep in the milestones of group/inv in GitLab?"}
    assert:
      - type: skill-used
        value: scope-stability
      - type: not-skill-used
        value: commitment-delivered
      - type: javascript
        value: |
          const o = String(output);
          return /Sprint 4/.test(o) && /unstable|\b400\s?%/i.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);

  - description: a re-estimate is reported as a change
    providers: [configured]
    vars: {request: "Was any issue re-estimated during Sprint 5 of Plane project INV?"}
    assert:
      - type: skill-used
        value: scope-stability
      - type: icontains
        value: INV-18
      - type: llm-rubric
        value: >-
          The answer says INV-18 was re-estimated from 2 to 3 points during Sprint 5.

  - description: a swap is not hidden by the balance
    providers: [configured]
    vars: {request: "How stable was the scope of Sprint 1 of group/inv in GitLab? It started and ended with about the same size."}
    assert:
      - type: skill-used
        value: scope-stability
      - type: javascript
        value: |
          const o = String(output);
          const rounds = (text, n, percent) => [...text.matchAll(percent ? /(\d+(?:[.,]\d+)?)\s?%/g : /(?<![\d.,])(\d+(?:[.,]\d+)?)/g)]
            .some(m => Math.round(Number(m[1].replace(',', '.'))) === n);  // 90,6 says 91: the agent may quote the JSON
          return rounds(o, 69, true)
            && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer says the scope changed (2 points added and 2 removed, 69% stability) although the size stayed the same. It does not call the sprint stable.

  - description: no project given - lists the projects and asks which one
    providers: [configured]
    vars: {request: "Qual a estabilidade de escopo da sprint no GitLab?"}
    assert:
      - type: skill-used
        value: scope-stability
      - type: icontains
        value: group/inv
      - type: llm-rubric
        value: >-
          The answer lists the GitLab project found (group/inv) and asks the user to confirm which project to analyze. It reports no stability numbers.

  - description: planned vs done goes to commitment-delivered (pt)
    providers: [configured]
    vars: {request: "Quanto do que foi planejado foi concluído nas milestones do group/inv no GitLab?"}
    assert:
      - type: not-skill-used
        value: scope-stability
      - type: skill-used
        value: commitment-delivered

  - description: say/do goes to commitment-delivered (en)
    providers: [configured]
    vars: {request: "What is the say/do ratio of Plane project INV?"}
    assert:
      - type: not-skill-used
        value: scope-stability
      - type: skill-used
        value: commitment-delivered

  - description: velocity goes to team-velocity (pt)
    providers: [configured]
    vars: {request: "Qual a velocidade do time no projeto INV do Plane?"}
    assert:
      - type: not-skill-used
        value: scope-stability
      - type: skill-used
        value: team-velocity

  - description: a general agile question uses no skill
    providers: [configured]
    vars: {request: "In general terms, what is scope creep in Scrum? Just explain, no need to look at any project."}
    assert:
      - type: not-skill-used
        value: scope-stability

  - description: Plane credentials missing - relays NOT CONFIGURED and invents no numbers
    providers: [unconfigured]
    vars: {request: "What is the scope stability of cycle Sprint 1 of project INV in Plane?"}
    assert:
      # Without credentials the MCP tool's result carries the error rules, so calling the tool counts as
      # using the skill here (decided by the user); every other case still needs the skill loaded.
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Skill' && (c.input || {}).skill === 'scope-stability')
            || calls.some(c => /__scope_stability$/.test(c.name));
      - type: icontains
        value: PLANE_URL
      - type: icontains
        value: PLANE_WORKSPACE
      - type: icontains
        value: PLANE_API_KEY
      - type: llm-rubric
        value: >-
          The answer says Plane is not configured, names the missing variables and how to set them, and reports no stability numbers.

  - description: GitLab credentials missing - relays NOT CONFIGURED in Portuguese
    providers: [unconfigured]
    vars: {request: "Qual a estabilidade de escopo da Sprint 1 do group/inv no GitLab?"}
    assert:
      # Without credentials the MCP tool's result carries the error rules, so calling the tool counts as
      # using the skill here (decided by the user); every other case still needs the skill loaded.
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Skill' && (c.input || {}).skill === 'scope-stability')
            || calls.some(c => /__scope_stability$/.test(c.name));
      - type: icontains
        value: GITLAB_URL
      - type: icontains
        value: GITLAB_TOKEN
      - type: llm-rubric
        value: >-
          The answer explains that GitLab is not configured, names GITLAB_URL and GITLAB_TOKEN and how to set them, and reports no stability numbers.

  - description: never changes data, even when asked to undo the changes
    providers: [configured]
    vars: {request: "Show the scope stability of Sprint 2 of group/inv in GitLab and put back the issue that was removed from it."}
    assert:
      - type: skill-used
        value: scope-stability
      - type: javascript
        value: |
          // A call of an MCP tool counts as a run of its skill's script: mcp/server.py runs the same command line
          // (a call refused for a missing skill_read ran nothing, so it stays as it is)
          const SCRIPTS = { team_velocity: 'velocity.py', commitment_delivered: 'commitment.py', scope_stability: 'stability.py',
            delivery_quality: 'quality.py', stale_issues: 'stale.py', blocked_issues: 'blocked.py', assign_issues: 'assign.py',
            populate_project: 'populate.py' };
          const asFlags = ([key, value]) => { const flag = '--' + key.replace(/_/g, '-');
            return value === true ? [flag] : value === false || value == null ? [] : [].concat(value).flatMap(item => [flag, item]); };
          const asScriptRun = c => { const tool = String(c.name || '').split('__').pop(), input = c.input || {};
            if (/Nothing was run: load the/.test(JSON.stringify(c.output || ''))) return c;
            if (!SCRIPTS[tool]) return c;
            const flags = Object.entries(input).filter(([key]) => key !== 'command' && key !== 'skill_read').flatMap(asFlags);
            return { ...c, name: 'Bash', input: { command: ['python3', SCRIPTS[tool], input.command || '', ...flags].join(' ') } }; };
          context = { ...context, providerResponse: { ...context.providerResponse, metadata: { ...(context.providerResponse?.metadata || {}),
            toolCalls: (context.providerResponse?.metadata?.toolCalls || []).map(asScriptRun) } } };
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return !calls.some(c => c.name === 'Bash' && /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(JSON.stringify(c.input || {})));
      - type: llm-rubric
        value: >-
          The answer reports the scope change and says it did not and will not change GitLab because the skill only reports. It does not claim any issue was moved.
