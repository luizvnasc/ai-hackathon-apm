# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: delivery-quality skill evals
# Two providers share one agent setup and differ only in the environment:
#   unconfigured - credentials blank: routing tests and the NOT CONFIGURED path.
#   configured   - fake credentials; the scripts' HTTP layer is mocked by ../mock/sitecustomize.py
#                  and answers from the shared fixtures/, so reports have known numbers.
#                  EVAL_DATASET_DATE is the date the dataset was written for; the mock shifts every
#                  fixture date so that date becomes the real today (the agent and the script then
#                  agree on "today" and the numbers never drift). The mock covers only Python's
#                  urlopen; containment comes from sandbox/run.py, the only way to run this
#                  config (working_dir does not exist elsewhere). See tests/README.md.
providers:
  - id: anthropic:claude-agent-sdk
    label: unconfigured
    config: &agent
      working_dir: /sandbox/tests/evals/.workspace   # exists only in sandbox/run.py's container
      setting_sources: ['project']
      skills: 'all'
      append_allowed_tools: ['Read', 'Bash', 'mcp__hackathon-metrics__team_velocity', 'mcp__hackathon-metrics__commitment_delivered', 'mcp__hackathon-metrics__scope_stability', 'mcp__hackathon-metrics__delivery_quality', 'mcp__hackathon-metrics__stale_issues', 'mcp__hackathon-metrics__blocked_issues', 'mcp__hackathon-metrics__assign_issues', 'mcp__hackathon-metrics__populate_project']
      # The package's MCP server, from the same place as in a user's project (see sync-skills.sh)
      mcp:
        enabled: true
        servers:
          - name: hackathon-metrics
            command: python3
            args: ['apm_modules/luizvnasc/ai-hackathon-apm/mcp/server.py']
      disallowed_tools: ['Write', 'Edit', 'WebFetch', 'WebSearch']
      max_turns: 8
      max_budget_usd: 0.5
      apiKeyRequired: false
      model: haiku
      env:
        GITLAB_URL: ''
        GITLAB_TOKEN: ''
        PLANE_URL: ''
        PLANE_WORKSPACE: ''
        PLANE_API_KEY: ''
  - id: anthropic:claude-agent-sdk
    label: configured
    config:
      <<: *agent
      env:
        GITLAB_URL: http://gitlab.mock
        GITLAB_TOKEN: glpat-eval-fake
        PLANE_URL: http://plane.mock
        PLANE_WORKSPACE: eval
        PLANE_API_KEY: plane-eval-fake
        PYTHONPATH: '{{ env.PWD }}/.workspace/mock'
        EVAL_FIXTURES: '{{ env.PWD }}/.workspace/fixtures'
        EVAL_DATASET_DATE: '2026-11-12'
        EVAL_PLANE_NO_ESTIMATES: '1'   # Plane CE as released (makeplane/plane#9933)

prompts:
  - '{{request}}'

# Grader for llm-rubric: a tool-less agent, on the sandbox's credential like the agent under test.
defaultTest:
  options:
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        model: haiku
        custom_allowed_tools: []
        max_turns: 1
        max_budget_usd: 0.1

tests:
  # Fixtures (shared dataset, dataset date 2026-11-12, shifted to the real today; Plane INV and GitLab group/inv agree).
  # Passes through to fix live only in the history, so the other skills see the same data:
  #   delivered / went to fix / passes / quality: S1 4/1/1/75% attention (#2), S2 3/1/2/67% poor (#7 twice),
  #   S3 3/1/1/67% poor (#12: its Sprint 2 pass does not count; #10 went before joining, counts nowhere),
  #   S4 2/0/0/100% good, S5 (current) 1/0/0/100% good, #17 went to fix and is still open (listed, not counted).
  #   Median of S1-S4: 71%, poor, improving (+8 pp per period).
  # ---------------------------------------------------------------- positive triggers (real results)
  - description: triggers on the quality of one cycle (en, Plane)
    providers: [configured]
    vars: {request: "What was the delivery quality of cycle Sprint 3 in project INV in Plane? How many tickets went back to fix?"}
    assert:
      - type: skill-used
        value: delivery-quality
      - type: javascript
        value: |
          const o = String(output);
          const rounds = (text, n, percent) => [...text.matchAll(percent ? /(\d+(?:[.,]\d+)?)\s?%/g : /(?<![\d.,])(\d+(?:[.,]\d+)?)/g)]
            .some(m => Math.round(Number(m[1].replace(',', '.'))) === n);  // 90,6 says 91: the agent may quote the JSON
          return rounds(o, 67, true) && /INV-12\b/.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer says that in Sprint 3, 1 of 3 delivered issues (INV-12) went back to fix, a quality of about 67%,
          rated poor. It does not count INV-10 as having gone to fix in Sprint 3. It invents no other issues and names
          no person as responsible.

  - description: triggers on qualidade das sprints (pt, GitLab)
    providers: [configured]
    vars: {request: "Qual a qualidade das sprints do projeto group/inv no GitLab? Quantos tickets voltaram para to fix?"}
    assert:
      - type: skill-used
        value: delivery-quality
      - type: javascript
        value: |
          const o = String(output);
          const rounds = (text, n, percent) => [...text.matchAll(percent ? /(\d+(?:[.,]\d+)?)\s?%/g : /(?<![\d.,])(\d+(?:[.,]\d+)?)/g)]
            .some(m => Math.round(Number(m[1].replace(',', '.'))) === n);  // 90,6 says 91: the agent may quote the JSON
          return rounds(o, 75, true) && rounds(o, 71, true)
            && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer (in Portuguese) gives the quality per sprint: Sprint 1 75% (attention), Sprint 2 and Sprint 3 about
          67% (poor), Sprint 4 100% (good), Sprint 5 partial; a median of about 71% and an improving trend. It lists
          the issues that went back (#2, #7 twice, #12) and does not blame anyone.

  - description: triggers on tickets voltando no ciclo atual (pt, Plane)
    providers: [configured]
    vars: {request: "Quantos tickets voltaram para to fix na sprint atual do projeto INV no Plane?"}
    assert:
      - type: skill-used
        value: delivery-quality
      - type: llm-rubric
        value: >-
          The answer (in Portuguese) is about Sprint 5, the current cycle: none of what was delivered so far went back
          to fix, and INV-17 went to fix but is still open, so it is listed and not counted. It says the period is
          still running (partial). It invents no other issues.

  - description: triggers on rework per cycle (en)
    providers: [configured]
    vars: {request: "How much rework did the team have per cycle in project INV in Plane? I mean tickets sent back to fix."}
    assert:
      - type: skill-used
        value: delivery-quality
      - type: javascript
        value: |
          // A call of an MCP tool counts as a run of its skill's script: mcp/server.py runs the same command line
          // (a call refused for a missing skill_read ran nothing, so it stays as it is)
          const SCRIPTS = { team_velocity: 'velocity.py', commitment_delivered: 'commitment.py', scope_stability: 'stability.py',
            delivery_quality: 'quality.py', stale_issues: 'stale.py', blocked_issues: 'blocked.py', assign_issues: 'assign.py',
            populate_project: 'populate.py' };
          const asFlags = ([key, value]) => { const flag = '--' + key.replace(/_/g, '-');
            return value === true ? [flag] : value === false || value == null ? [] : [].concat(value).flatMap(item => [flag, item]); };
          const asScriptRun = c => { const tool = String(c.name || '').split('__').pop(), input = c.input || {};
            if (/Nothing was run: load the/.test(JSON.stringify(c.output || ''))) return c;
            if (!SCRIPTS[tool]) return c;
            const flags = Object.entries(input).filter(([key]) => key !== 'command' && key !== 'skill_read').flatMap(asFlags);
            return { ...c, name: 'Bash', input: { command: ['python3', SCRIPTS[tool], input.command || '', ...flags].join(' ') } }; };
          context = { ...context, providerResponse: { ...context.providerResponse, metadata: { ...(context.providerResponse?.metadata || {}),
            toolCalls: (context.providerResponse?.metadata?.toolCalls || []).map(asScriptRun) } } };
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Bash' && /quality\.py/.test(JSON.stringify(c.input || {})) && /report/.test(JSON.stringify(c.input || {})));

  - description: the team calls the step by another name - passes it and does not call it perfect
    providers: [configured]
    vars: {request: "No nosso time a coluna de correção se chama Devolvida. Qual a qualidade da Sprint 2 do group/inv no GitLab?"}
    assert:
      - type: skill-used
        value: delivery-quality
      - type: javascript
        value: |
          // A call of an MCP tool counts as a run of its skill's script: mcp/server.py runs the same command line
          // (a call refused for a missing skill_read ran nothing, so it stays as it is)
          const SCRIPTS = { team_velocity: 'velocity.py', commitment_delivered: 'commitment.py', scope_stability: 'stability.py',
            delivery_quality: 'quality.py', stale_issues: 'stale.py', blocked_issues: 'blocked.py', assign_issues: 'assign.py',
            populate_project: 'populate.py' };
          const asFlags = ([key, value]) => { const flag = '--' + key.replace(/_/g, '-');
            return value === true ? [flag] : value === false || value == null ? [] : [].concat(value).flatMap(item => [flag, item]); };
          const asScriptRun = c => { const tool = String(c.name || '').split('__').pop(), input = c.input || {};
            if (/Nothing was run: load the/.test(JSON.stringify(c.output || ''))) return c;
            if (!SCRIPTS[tool]) return c;
            const flags = Object.entries(input).filter(([key]) => key !== 'command' && key !== 'skill_read').flatMap(asFlags);
            return { ...c, name: 'Bash', input: { command: ['python3', SCRIPTS[tool], input.command || '', ...flags].join(' ') } }; };
          context = { ...context, providerResponse: { ...context.providerResponse, metadata: { ...(context.providerResponse?.metadata || {}),
            toolCalls: (context.providerResponse?.metadata?.toolCalls || []).map(asScriptRun) } } };
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Bash' && /quality\.py/.test(JSON.stringify(c.input || {}))
            && /--fix-names[^"]*?devolvida|--fix-names\s+\\?["']?[^"']*devolvida/i.test(JSON.stringify(c.input || {})));
      - type: llm-rubric
        value: >-
          The answer (in Portuguese) says that with the name "Devolvida" no issue of Sprint 2 went back, and warns that
          this can mean the team uses another name or the step is not recorded, instead of only declaring the sprint
          perfect. It may mention that under the name "to fix" one issue (#7) went back twice.

  - description: no project given - lists the projects and asks which one
    providers: [configured]
    vars: {request: "What is the delivery quality of our sprints in Plane?"}
    assert:
      - type: skill-used
        value: delivery-quality
      - type: icontains
        value: INV
      - type: llm-rubric
        value: >-
          The answer lists the Plane projects (Inventory / INV) and asks which one to use, or goes on with INV.
          It does not invent other projects.

  # ---------------------------------------------------------------- near misses
  - description: what entered the sprint goes to scope-stability (en)
    providers: [configured]
    vars: {request: "What entered and left cycle Sprint 3 of project INV in Plane after it started?"}
    assert:
      - type: not-skill-used
        value: delivery-quality
      - type: skill-used
        value: scope-stability

  - description: planned vs done goes to commitment-delivered (pt)
    providers: [configured]
    vars: {request: "O time entregou o que prometeu na Sprint 2 do projeto group/inv no GitLab?"}
    assert:
      - type: not-skill-used
        value: delivery-quality
      - type: skill-used
        value: commitment-delivered

  - description: blocked work goes to blocked-issues (en)
    providers: [configured]
    vars: {request: "Which issues are blocked in cycle Sprint 5 of project INV in Plane, and why?"}
    assert:
      - type: not-skill-used
        value: delivery-quality
      - type: skill-used
        value: blocked-issues

  - description: a general question about quality uses no skill
    providers: [configured]
    vars: {request: "In general, how can a Scrum team reduce rework? No need to look at any project."}
    assert:
      - type: not-skill-used
        value: delivery-quality

  # ---------------------------------------------------------------- missing configuration
  - description: Plane credentials missing - relays NOT CONFIGURED and invents no numbers
    providers: [unconfigured]
    vars: {request: "What is the delivery quality of cycle Sprint 1 of project INV in Plane?"}
    assert:
      # Without credentials the MCP tool's result carries the error rules, so calling the tool counts as
      # using the skill here (decided by the user); every other case still needs the skill loaded.
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Skill' && (c.input || {}).skill === 'delivery-quality')
            || calls.some(c => /__delivery_quality$/.test(c.name));
      - type: icontains
        value: PLANE_URL
      - type: icontains
        value: PLANE_WORKSPACE
      - type: icontains
        value: PLANE_API_KEY
      - type: llm-rubric
        value: >-
          The answer says Plane is not configured, names the missing variables and how to set them, and reports no
          quality numbers. It does not ask for a token's value in the chat.

  - description: GitLab credentials missing - relays NOT CONFIGURED in Portuguese
    providers: [unconfigured]
    vars: {request: "Quantos tickets voltaram para to fix na Sprint 1 do group/inv no GitLab?"}
    assert:
      # Without credentials the MCP tool's result carries the error rules, so calling the tool counts as
      # using the skill here (decided by the user); every other case still needs the skill loaded.
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Skill' && (c.input || {}).skill === 'delivery-quality')
            || calls.some(c => /__delivery_quality$/.test(c.name));
      - type: icontains
        value: GITLAB_URL
      - type: icontains
        value: GITLAB_TOKEN
      - type: llm-rubric
        value: >-
          The answer (in Portuguese) says GitLab is not configured, names GITLAB_URL and GITLAB_TOKEN and how to set
          them, and reports no numbers.

  # ---------------------------------------------------------------- read-only
  - description: never changes data, even when asked to move an issue out of to fix
    providers: [configured]
    vars: {request: "Move INV-17 out of To Fix back to In Progress in Plane, then tell me the delivery quality of Sprint 5 of project INV."}
    assert:
      - type: skill-used
        value: delivery-quality
      - type: javascript
        value: |
          // A call of an MCP tool counts as a run of its skill's script: mcp/server.py runs the same command line
          // (a call refused for a missing skill_read ran nothing, so it stays as it is)
          const SCRIPTS = { team_velocity: 'velocity.py', commitment_delivered: 'commitment.py', scope_stability: 'stability.py',
            delivery_quality: 'quality.py', stale_issues: 'stale.py', blocked_issues: 'blocked.py', assign_issues: 'assign.py',
            populate_project: 'populate.py' };
          const asFlags = ([key, value]) => { const flag = '--' + key.replace(/_/g, '-');
            return value === true ? [flag] : value === false || value == null ? [] : [].concat(value).flatMap(item => [flag, item]); };
          const asScriptRun = c => { const tool = String(c.name || '').split('__').pop(), input = c.input || {};
            if (/Nothing was run: load the/.test(JSON.stringify(c.output || ''))) return c;
            if (!SCRIPTS[tool]) return c;
            const flags = Object.entries(input).filter(([key]) => key !== 'command' && key !== 'skill_read').flatMap(asFlags);
            return { ...c, name: 'Bash', input: { command: ['python3', SCRIPTS[tool], input.command || '', ...flags].join(' ') } }; };
          context = { ...context, providerResponse: { ...context.providerResponse, metadata: { ...(context.providerResponse?.metadata || {}),
            toolCalls: (context.providerResponse?.metadata?.toolCalls || []).map(asScriptRun) } } };
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return !calls.some(c => c.name === 'Bash' && /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(JSON.stringify(c.input || {})));
      - type: llm-rubric
        value: >-
          The answer reports the quality of Sprint 5 and says it did not and will not change Plane because the skill
          only reports; it may tell the user how to move INV-17 by hand. It does not claim INV-17 was moved.
