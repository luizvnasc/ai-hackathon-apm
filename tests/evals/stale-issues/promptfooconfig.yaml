# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: stale-issues skill evals
# Two providers share one agent setup and differ only in the environment:
#   unconfigured - credentials blank: routing tests and the NOT CONFIGURED path.
#   configured   - fake credentials; the scripts' HTTP layer is mocked by ../mock/sitecustomize.py
#                  and answers from the shared fixtures/, so reports have known numbers.
#                  EVAL_DATASET_DATE is the date the dataset was written for; the mock shifts every
#                  fixture date so that date becomes the real today (the agent and the script then
#                  agree on "today" and the numbers never drift). Nothing reaches a network and
#                  the mock refuses every write. See tests/README.md.
providers:
  - id: anthropic:claude-agent-sdk
    label: unconfigured
    config: &agent
      working_dir: ../.workspace
      setting_sources: ['project']
      skills: 'all'
      append_allowed_tools: ['Read', 'Bash']
      disallowed_tools: ['Write', 'Edit', 'WebFetch', 'WebSearch']
      max_turns: 8
      max_budget_usd: 0.5
      apiKeyRequired: false
      model: haiku
      env:
        GITLAB_URL: ''
        GITLAB_TOKEN: ''
        PLANE_URL: ''
        PLANE_WORKSPACE: ''
        PLANE_API_KEY: ''
  - id: anthropic:claude-agent-sdk
    label: configured
    config:
      <<: *agent
      env:
        GITLAB_URL: http://gitlab.mock
        GITLAB_TOKEN: glpat-eval-fake
        PLANE_URL: http://plane.mock
        PLANE_WORKSPACE: eval
        PLANE_API_KEY: plane-eval-fake
        PYTHONPATH: '{{ env.PWD }}/.workspace/mock'
        EVAL_FIXTURES: '{{ env.PWD }}/.workspace/fixtures'
        EVAL_DATASET_DATE: '2026-11-12'
        EVAL_PLANE_NO_ESTIMATES: '1'   # Plane CE as released (makeplane/plane#9933)

prompts:
  - '{{request}}'

# Grader for llm-rubric: a tool-less agent, so it also works with the local Claude Code login.
defaultTest:
  options:
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        model: haiku
        custom_allowed_tools: []
        max_turns: 1
        max_budget_usd: 0.1

tests:
  # Fixtures (shared dataset, Plane INV and GitLab group/inv hold the same data; dataset date 2026-11-12, shifted to the real today; dates below are as written, default threshold 14 days):
  #   Open issues (9, 30 points): Sprint 5 = INV-16 bob 8 (In Progress, idle 8 d), INV-17 carol 3 (Blocked, idle 7 d),
  #     INV-18 alice 3 (Todo, label stale, idle 2 d); Sprint 6 = INV-19 bob 5, INV-20 carol 3 (not started, idle 8 d);
  #     no cycle: INV-9 bob 2 (In Progress, idle 54 d), INV-21 carol 2 (Todo, idle 49 d),
  #     INV-22 bob 3 (label stale, idle 5 d), INV-23 unassigned 1 (Todo, idle 13 d). GitLab: same numbers as #9 .. #23.
  #   Whole project (--all, 14 d): 4 of 9 open stale, 10 of 30 points (33%): stalled 1 (INV-9, 54 d), not started 1
  #     (INV-21, 49 d), marked stale 2 (INV-22, INV-18), blocked 0. Per person: bob 2, carol 1, alice 1.
  #     Getting stale (idle > 7 d): INV-23 (13 d), INV-16 (8 d), INV-19 (8 d), INV-20 (8 d).
  #   Sprint 5, default 14 d: 1 of 3 stale (INV-18 marked stale, 3 of 14 points = 21%); INV-16 is getting stale (8 d).
  #   Sprint 5, --stale-days 5: 3 of 3 stale, 14 of 14 points (100%): INV-16 stalled 8 d (bob), INV-17 blocked 7 d (carol),
  #     INV-18 marked stale 2 d (alice). The cycle ends in 10 days.
  #   periods: Sprint 5 3 open / 1 stale, Sprint 6 2 open / 0 stale, whole project 9 open / 4 stale.
  #   A "not started" issue cannot be stale inside Sprint 5 at 14 d (its clock starts at the cycle start, 3 days ago).
  # ---------------------------------------------------------------- positive triggers (real numbers)
  - description: triggers on stale issues of the whole project (en, Plane)
    providers: [configured]
    vars: {request: "Which issues are stale in project INV in Plane? Check the whole project."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return bash.some(c => /stale\.py/.test(c)) && !bash.some(c => /\b(curl|wget)\b/.test(c))
      - type: javascript
        value: |
          const o = String(output);
          return ['INV-9', 'INV-21', 'INV-22', 'INV-18'].every(k => o.includes(k)) && /\b(54|53[.,]6)\b/.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] MISS|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);

  - description: triggers on issues paradas of the whole project (pt, GitLab)
    providers: [configured]
    vars: {request: "Quais issues estão paradas no projeto group/inv do GitLab? Pode olhar o projeto inteiro."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return bash.some(c => /stale\.py/.test(c)) && !bash.some(c => /\b(curl|wget)\b/.test(c))
      - type: javascript
        value: |
          const o = String(output);
          return ['#9', '#21', '#22', '#18'].every(k => o.includes(k)) && /\b(33\s?%|10 (de|of) 30)/.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] MISS|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);

  - description: triggers on what is idle in the current sprint with a threshold (pt, Plane)
    providers: [configured]
    vars: {request: "O que está parado na sprint atual (Sprint 5) do projeto INV no Plane? Considere parado o que não muda há mais de 5 dias."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return bash.some(c => /stale\.py/.test(c)) && !bash.some(c => /\b(curl|wget)\b/.test(c))
      - type: javascript
        value: |
          const o = String(output);
          return ['INV-16', 'INV-17', 'INV-18'].every(k => o.includes(k)) && /--stale-days/.test(JSON.stringify((context.providerResponse?.metadata?.toolCalls || []).map(c => c.input)))
            && !/NOT CONFIGURED|\[eval-mock\] MISS|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer (in Portuguese) says all 3 open issues of Sprint 5 are stale (14 of 14 points): INV-16 stalled
          (in progress, about 8 days idle, bob), INV-17 blocked (about 7 days, carol) and INV-18 marked stale (alice).
          Extra detail is fine; fail only if it contradicts these or invents other issues or people.

  - description: triggers on untouched tickets of a milestone with the default threshold (en, GitLab)
    providers: [configured]
    vars: {request: "List the tickets in milestone Sprint 5 of group/inv on GitLab that nobody has touched for more than two weeks."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return bash.some(c => /stale\.py/.test(c)) && !bash.some(c => /\b(curl|wget)\b/.test(c))
      - type: javascript
        value: |
          const o = String(output);
          return o.includes('#18')
            && !/NOT CONFIGURED|\[eval-mock\] MISS|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer says only 1 of the 3 open issues of milestone Sprint 5 is stale: #18, because it carries a
          stale label (it was touched 2 days ago). It does not list #16 or #17 as stale (#16 is at most mentioned
          as getting stale, idle about 8 days). Extra detail is fine.

  - description: no cycle given - lists the open cycles with their stale counts and asks which one
    providers: [configured]
    vars: {request: "Tickets stale no projeto INV do Plane."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: javascript
        value: |
          const o = String(output);
          return /Sprint 5/.test(o) && /Sprint 6/.test(o)
            && !/NOT CONFIGURED|\[eval-mock\] MISS|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer shows the open cycles Sprint 5 (3 open issues, 1 stale) and Sprint 6 (2 open, 0 stale),
          possibly the whole project (9 open, 4 stale), and asks which cycle (or the whole project) to check.
          It does not yet list individual stale issues as the final result.

  - description: no project given - lists the projects and asks which one
    providers: [configured]
    vars: {request: "Issues paradas no Plane, o que está esquecido?"}
    assert:
      - type: skill-used
        value: stale-issues
      - type: icontains
        value: INV
      - type: llm-rubric
        value: >-
          The answer lists the Plane projects found (Inventory / INV) and asks the user which one to
          analyze. It reports no stale issues yet.

  # ---------------------------------------------------------------- near misses
  - description: blocked issues go to blocked-issues (en)
    providers: [configured]
    vars: {request: "Which issues are blocked in project INV in Plane, and what is blocking them?"}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: blocked-issues

  - description: impedimentos go to blocked-issues (pt)
    providers: [configured]
    vars: {request: "Quais são os impedimentos e dependências que estão travando issues no milestone Sprint 5 do group/inv no GitLab?"}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: blocked-issues

  - description: velocity goes to team-velocity (pt)
    providers: [configured]
    vars: {request: "Qual a velocidade do time no projeto INV do Plane? Quantos pontos planejar no próximo ciclo?"}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: team-velocity

  - description: say/do ratio goes to commitment-delivered (en)
    providers: [configured]
    vars: {request: "Did the team deliver what it committed to in the last milestones of group/inv in GitLab? I want the say/do ratio."}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: commitment-delivered

  - description: who should take an issue goes to assign-issues (en)
    providers: [configured]
    vars: {request: "Who should take issue INV-18 in project INV in Plane?"}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: assign-issues

  - description: a general question uses no skill
    providers: [configured]
    vars: {request: "In general terms, what does it mean when a ticket is called stale in agile teams? No need to look at any project."}
    assert:
      - type: not-skill-used
        value: stale-issues

  # ---------------------------------------------------------------- missing configuration
  - description: Plane credentials missing - relays NOT CONFIGURED and invents no issues
    providers: [unconfigured]
    vars: {request: "Which issues are stale in project INV in Plane? Check the whole project."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: icontains
        value: PLANE_URL
      - type: icontains
        value: PLANE_WORKSPACE
      - type: icontains
        value: PLANE_API_KEY
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return bash.some(c => /stale\.py/.test(c)) && !bash.some(c => /\b(curl|wget)\b/.test(c))
      - type: llm-rubric
        value: >-
          The answer says the Plane connection is not configured, names the missing variables
          (PLANE_URL, PLANE_WORKSPACE, PLANE_API_KEY) and explains how to set them (environment
          variable or .env). It lists no stale issues, idle days, counts or other results, and it
          does not ask the user to paste a token or API key into the chat.

  - description: GitLab credentials missing - relays NOT CONFIGURED in Portuguese
    providers: [unconfigured]
    vars: {request: "Quais issues estão paradas no projeto group/inv do GitLab? Pode olhar o projeto inteiro."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: icontains
        value: GITLAB_URL
      - type: icontains
        value: GITLAB_TOKEN
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return bash.some(c => /stale\.py/.test(c)) && !bash.some(c => /\b(curl|wget)\b/.test(c))
      - type: llm-rubric
        value: >-
          The answer explains that GitLab is not configured, names GITLAB_URL and GITLAB_TOKEN
          and how to set them, and reports no stale issues, milestones, dates or counts.

  # ---------------------------------------------------------------- read-only
  - description: never changes data, even when asked to clean up
    providers: [configured]
    vars: {request: "Find the stale issues of the whole project INV in Plane and close all of them for me."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return bash.some(s => /stale\.py/.test(s)) && !bash.some(s => /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(s));
      - type: javascript
        value: |
          !/\[eval-mock\] (MISS|WRITE REFUSED)/.test(String(output))
      - type: llm-rubric
        value: >-
          The answer lists the stale issues (INV-9, INV-21, INV-22, INV-18) and explains that the
          stale-issues report is read-only: it does not claim that any issue was closed, moved,
          labelled or otherwise changed, and it may suggest the user does it.
