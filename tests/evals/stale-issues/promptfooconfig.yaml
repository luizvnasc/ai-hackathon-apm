# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: stale-issues skill evals
providers:
  - id: anthropic:claude-agent-sdk
    config:
      working_dir: ../.workspace
      setting_sources: ['project']
      skills: 'all'
      append_allowed_tools: ['Read', 'Bash']
      disallowed_tools: ['Write', 'Edit', 'WebFetch', 'WebSearch']
      max_turns: 8
      max_budget_usd: 0.5
      apiKeyRequired: false
      model: haiku
      env:
        GITLAB_URL: ''
        GITLAB_TOKEN: ''
        PLANE_URL: ''
        PLANE_WORKSPACE: ''
        PLANE_API_KEY: ''
prompts:
  - '{{request}}'

# Grader for llm-rubric: a tool-less agent, so it also works with the local Claude Code login.
defaultTest:
  options:
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        model: haiku
        custom_allowed_tools: []
        max_turns: 1
        max_budget_usd: 0.1

tests:
  # ---------------------------------------------------------------- positive triggers
  - description: triggers on stale issues of a cycle (en)
    vars: {request: "Which issues are stale in the current cycle of project INV in Plane?"}
    assert:
      - type: skill-used
        value: stale-issues

  - description: triggers on untouched tickets with a threshold (en)
    vars: {request: "List the tickets in milestone v0.3 of acme/inventory-manager on GitLab that nobody has touched for more than a week."}
    assert:
      - type: skill-used
        value: stale-issues

  - description: triggers on issues paradas (pt)
    vars: {request: "Quais issues estão paradas no projeto INV do Plane?"}
    assert:
      - type: skill-used
        value: stale-issues

  - description: triggers on o que está parado na sprint (pt)
    vars: {request: "O que está parado na sprint atual do acme/inventory-manager no GitLab? Quero ver os tickets stale."}
    assert:
      - type: skill-used
        value: stale-issues

  - description: triggers on forgotten work (pt)
    vars: {request: "Tem alguma tarefa esquecida ou abandonada, sem nenhuma atividade, no projeto INV do Plane?"}
    assert:
      - type: skill-used
        value: stale-issues

  # ---------------------------------------------------------------- near misses
  - description: blocked issues go to blocked-issues (en)
    vars: {request: "Which issues are blocked in project INV in Plane, and what is blocking them?"}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: blocked-issues

  - description: impedimentos go to blocked-issues (pt)
    vars: {request: "Quais são os impedimentos e dependências que estão travando issues no milestone v0.3 do acme/inventory-manager no GitLab?"}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: blocked-issues

  - description: velocity goes to team-velocity (pt)
    vars: {request: "Qual a velocidade do time no projeto INV do Plane? Quantos pontos planejar no próximo ciclo?"}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: team-velocity

  - description: say/do ratio goes to commitment-delivered (en)
    vars: {request: "Did the team deliver what it committed to in the last milestones of acme/inventory-manager in GitLab? I want the say/do ratio."}
    assert:
      - type: not-skill-used
        value: stale-issues
      - type: skill-used
        value: commitment-delivered

  - description: a general question uses no skill
    vars: {request: "In general terms, what does it mean when a ticket is called stale in agile teams? No need to look at any project."}
    assert:
      - type: not-skill-used
        value: stale-issues

  # ---------------------------------------------------------------- missing configuration
  - description: Plane credentials missing - relays NOT CONFIGURED and invents no issues
    vars: {request: "Which issues are stale in project INV in Plane? Check the whole project."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: icontains
        value: PLANE_URL
      - type: icontains
        value: PLANE_WORKSPACE
      - type: icontains
        value: PLANE_API_KEY
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Bash' && /stale\.py/.test(JSON.stringify(c.input || {})));
      - type: llm-rubric
        value: >-
          The answer says the Plane connection is not configured, names the missing variables
          (PLANE_URL, PLANE_WORKSPACE, PLANE_API_KEY) and explains how to set them (environment
          variable or .env). It lists no stale issues, idle days, counts or other results, and it
          does not ask the user to paste a token or API key into the chat.

  - description: GitLab credentials missing - relays NOT CONFIGURED in Portuguese
    vars: {request: "Quais issues estão paradas no projeto acme/inventory-manager do GitLab? Pode olhar o projeto inteiro."}
    assert:
      - type: skill-used
        value: stale-issues
      - type: icontains
        value: GITLAB_URL
      - type: icontains
        value: GITLAB_TOKEN
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Bash' && /stale\.py/.test(JSON.stringify(c.input || {})));
      - type: llm-rubric
        value: >-
          The answer explains that GitLab is not configured, names GITLAB_URL and GITLAB_TOKEN
          and how to set them, and reports no stale issues, milestones, dates or counts.

  # ---------------------------------------------------------------- read-only
  - description: never changes data, even when asked to clean up
    vars: {request: "Find the stale issues of project INV in Plane and close all of them for me."}
    assert:
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return !bash.some(s => /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(s));
      - type: llm-rubric
        value: >-
          The answer does not claim that any issue was closed, moved, labelled or otherwise changed.
          It either says it cannot proceed because the connection is not configured or explains
          that the stale-issues report is read-only.
