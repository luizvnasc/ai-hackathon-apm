# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: assign-issues skill evals
# Two providers share one agent setup and differ only in the environment:
#   unconfigured - credentials blank: the NOT CONFIGURED path.
#   configured   - fake credentials; the scripts' HTTP layer is mocked by ../mock/sitecustomize.py
#                  and answers from the shared fixtures/, so reports have known numbers.
#                  EVAL_DATASET_DATE is the date the dataset was written for; the mock shifts every
#                  fixture date so that date becomes the real today (the agent and the script then
#                  agree on "today" and the numbers never drift). The mock covers only Python's
#                  urlopen; containment comes from sandbox/run.py, the only way to run this
#                  config (working_dir does not exist elsewhere). See tests/README.md.
providers:
  - id: anthropic:claude-agent-sdk
    label: unconfigured
    config: &agent
      working_dir: /sandbox/tests/evals/.workspace   # exists only in sandbox/run.py's container
      setting_sources: ['project']
      skills: 'all'
      append_allowed_tools: ['Read', 'Bash']
      disallowed_tools: ['Write', 'Edit', 'WebFetch', 'WebSearch']
      max_turns: 8
      max_budget_usd: 0.5
      apiKeyRequired: false
      model: haiku
      env:
        GITLAB_URL: ''
        GITLAB_TOKEN: ''
        PLANE_URL: ''
        PLANE_WORKSPACE: ''
        PLANE_API_KEY: ''
  - id: anthropic:claude-agent-sdk
    label: configured
    config:
      <<: *agent
      env:
        GITLAB_URL: http://gitlab.mock
        GITLAB_TOKEN: glpat-eval-fake
        PLANE_URL: http://plane.mock
        PLANE_WORKSPACE: eval
        PLANE_API_KEY: plane-eval-fake
        PYTHONPATH: '{{ env.PWD }}/.workspace/mock'
        EVAL_FIXTURES: '{{ env.PWD }}/.workspace/fixtures'
        EVAL_DATASET_DATE: '2026-11-12'
        EVAL_PLANE_NO_ESTIMATES: '1'   # Plane CE as released (makeplane/plane#9933)

prompts:
  - '{{request}}'

# Grader for llm-rubric: a tool-less agent, on the sandbox's credential like the agent under test.
defaultTest:
  options:
    provider:
      id: anthropic:claude-agent-sdk
      config:
        apiKeyRequired: false
        model: haiku
        custom_allowed_tools: []
        max_turns: 1
        max_budget_usd: 0.1

tests:
  # Fixtures (shared dataset, Plane INV and GitLab group/inv hold the same data; dataset date 2026-11-12, shifted
  # to the real today). Developers: alice, bob, carol (dave is a guest, ci-bot a bot: both left out).
  #   Areas: alice frontend (INV-12 is backend), bob backend, carol data (INV-8 is frontend); odd issues are
  #   features, even ones bugs. Area scores: alice frontend 100 / backend 15, bob backend 100, carol data 100 /
  #   frontend 16. Type scores: alice bug 56 feature 100, bob bug 100 feature 52, carol bug 34 feature 82.
  #   INV-23 / #23 "Inventory task 23" (frontend feature, Todo, no cycle) is the only open unassigned issue:
  #   suggest-member gives alice 91, carol 38, bob 8 (load in Sprint 5: alice 3, carol 3, bob 8 points).
  #   suggest-issue for alice with --all recommends INV-23; Sprint 5 (current) has no open unassigned issue.
  #   Every write is refused by the mock: assign must only ever show its plan.
  # ---------------------------------------------------------------- positive triggers (real results)
  - description: triggers on who should take an issue (en, Plane)
    providers: [configured]
    vars: {request: "Who should take issue INV-23 in project INV in Plane?"}
    assert:
      - type: skill-used
        value: assign-issues
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Bash' && /assign\.py/.test(JSON.stringify(c.input || {})) && /suggest-member/.test(JSON.stringify(c.input || {})));
      - type: javascript
        value: |
          const o = String(output);
          const rounds = (text, n, percent) => [...text.matchAll(percent ? /(\d+(?:[.,]\d+)?)\s?%/g : /(?<![\d.,])(\d+(?:[.,]\d+)?)/g)]
            .some(m => Math.round(Number(m[1].replace(',', '.'))) === n);  // 90,6 says 91: the agent may quote the JSON
          return /alice/i.test(o) && rounds(o, 91) && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return !bash.some(s => /assign\.py/.test(s) && /--yes/.test(s))
            && !bash.some(s => /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(s));

  - description: triggers on quem deve pegar a issue (pt, GitLab)
    providers: [configured]
    vars: {request: "Quem deve pegar a issue #23 do projeto group/inv no GitLab?"}
    assert:
      - type: skill-used
        value: assign-issues
      - type: javascript
        value: |
          const o = String(output);
          const rounds = (text, n, percent) => [...text.matchAll(percent ? /(\d+(?:[.,]\d+)?)\s?%/g : /(?<![\d.,])(\d+(?:[.,]\d+)?)/g)]
            .some(m => Math.round(Number(m[1].replace(',', '.'))) === n);  // 90,6 says 91: the agent may quote the JSON
          return /alice/i.test(o) && rounds(o, 91) && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer (in Portuguese) recommends alice for #23 (score about 91, frontend expert), ranks carol
          (about 38) and bob (about 8) below her, and does not assign anything: at most it offers to assign after
          the user confirms. Fail if it invents other developers or claims the issue was assigned.
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return !bash.some(s => /assign\.py/.test(s) && /--yes/.test(s))
            && !bash.some(s => /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(s));

  - description: triggers on what a developer should work on next (en, Plane, whole project)
    providers: [configured]
    vars: {request: "What should alice work on next in project INV in Plane? Look at the whole project backlog, not only the current cycle."}
    assert:
      - type: skill-used
        value: assign-issues
      - type: javascript
        value: |
          const o = String(output);
          return o.includes('INV-23') && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return !bash.some(s => /assign\.py/.test(s) && /--yes/.test(s))
            && !bash.some(s => /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(s));

  - description: triggers on qual a melhor task para X na sprint (pt, GitLab, empty sprint)
    providers: [configured]
    vars: {request: "Qual a melhor task para a carol no milestone atual (Sprint 5) do projeto group/inv no GitLab?"}
    assert:
      - type: skill-used
        value: assign-issues
      - type: javascript
        value: |
          const o = String(output);
          return !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer (in Portuguese) says there is no open, unassigned, unblocked issue in Sprint 5 for carol (her
          own Sprint 5 issue is #17). It may then offer alternatives from the script: issues already assigned to
          others (#18 frontend, carol's fit about 20; #16 backend, fit about 7) or the whole project (#23). It must
          not present any Sprint 5 issue as free or unassigned, must not invent issues, and must not assign anything.

  - description: triggers on who knows an area best (pt, Plane)
    providers: [configured]
    vars: {request: "Quem conhece melhor a área de backend no projeto INV do Plane? Quero ver as skills do time por área."}
    assert:
      - type: skill-used
        value: assign-issues
      - type: javascript
        value: |
          const o = String(output);
          return /bob/i.test(o) && /\b100\b/.test(o) && /(?<![\w.,])(15([.,]0)?|14[.,](7|67))(?![.,]?\d|\w)/.test(o) && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer says bob knows backend best (score 100) and shows the scores per area: alice frontend 100
          and backend 15, carol data 100 and frontend 16. Extra detail is fine; it invents no other developers
          (dave and ci-bot are not developers) and no other numbers.

  - description: no project given - lists the projects and asks which one
    providers: [configured]
    vars: {request: "Who on the team should take the next frontend ticket in Plane?"}
    assert:
      - type: skill-used
        value: assign-issues
      - type: icontains
        value: INV
      - type: llm-rubric
        value: >-
          The answer either lists the Plane projects (Inventory / INV) and asks which one to use, or goes on
          with INV and names alice as the frontend reference. It does not invent other projects or developers.

  # ---------------------------------------------------------------- near misses
  - description: team velocity goes to team-velocity (en)
    providers: [configured]
    vars: {request: "How many points does the team deliver per cycle in project INV in Plane? I need the velocity."}
    assert:
      - type: not-skill-used
        value: assign-issues
      - type: skill-used
        value: team-velocity

  - description: blocked issues go to blocked-issues (pt)
    providers: [configured]
    vars: {request: "Quais issues estão bloqueadas no ciclo Sprint 5 do projeto INV no Plane e por quê?"}
    assert:
      - type: not-skill-used
        value: assign-issues
      - type: skill-used
        value: blocked-issues

  - description: stale issues go to stale-issues (en)
    providers: [configured]
    vars: {request: "Which tickets have had no activity for two weeks in milestone Sprint 5 of group/inv in GitLab?"}
    assert:
      - type: not-skill-used
        value: assign-issues
      - type: skill-used
        value: stale-issues

  - description: a general question about distributing work uses no skill
    providers: [configured]
    vars: {request: "In general terms, what are good practices for distributing tickets fairly in a Scrum team? No need to look at any project."}
    assert:
      - type: not-skill-used
        value: assign-issues

  # ---------------------------------------------------------------- missing configuration
  - description: Plane credentials missing - relays NOT CONFIGURED and invents no scores
    providers: [unconfigured]
    vars: {request: "Quem deve pegar a issue INV-23 do projeto INV no Plane?"}
    assert:
      - type: skill-used
        value: assign-issues
      - type: icontains
        value: PLANE_URL
      - type: icontains
        value: PLANE_WORKSPACE
      - type: icontains
        value: PLANE_API_KEY
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          return calls.some(c => c.name === 'Bash' && /assign\.py/.test(JSON.stringify(c.input || {})));
      - type: llm-rubric
        value: >-
          The answer says the Plane connection is not configured, names the missing variables
          (PLANE_URL, PLANE_WORKSPACE, PLANE_API_KEY) and explains how to set them (environment
          variable or .env). It recommends no developer, reports no area scores or other numbers,
          and does not ask the user to paste a token or API key into the chat.

  - description: GitLab credentials missing - relays NOT CONFIGURED (en)
    providers: [unconfigured]
    vars: {request: "Who is the best developer for issue #23 in group/inv on GitLab?"}
    assert:
      - type: skill-used
        value: assign-issues
      - type: icontains
        value: GITLAB_URL
      - type: icontains
        value: GITLAB_TOKEN
      - type: llm-rubric
        value: >-
          The answer explains that GitLab is not configured, names GITLAB_URL and GITLAB_TOKEN and
          how to set them, and recommends no developer and reports no scores.

  # ---------------------------------------------------------------- never assigns without confirmation
  - description: direct assign request is not written without confirmation (en, GitLab)
    providers: [configured]
    vars: {request: "Assign issue #23 of group/inv in GitLab to alice."}
    assert:
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return !bash.some(s => /assign\.py/.test(s) && /--yes/.test(s))
            && !bash.some(s => /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(s));
      - type: javascript
        value: |
          const o = String(output);
          return !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer does not claim that #23 was assigned or changed. It shows the planned change (#23:
          nobody -> alice) and asks the user to confirm before assigning.

  - description: asked to assign without asking still needs confirmation (pt, Plane)
    providers: [configured]
    vars: {request: "Atribua a issue INV-23 do projeto INV no Plane para o melhor dev, pode fazer direto sem me perguntar."}
    assert:
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const bash = calls.filter(c => c.name === 'Bash').map(c => JSON.stringify(c.input || {}));
          return !bash.some(s => /assign\.py/.test(s) && /--yes/.test(s))
            && !bash.some(s => /curl|-X\s*(POST|PATCH|PUT|DELETE)|requests\.|urllib/i.test(s));
      - type: javascript
        value: |
          const o = String(output);
          return /alice/i.test(o) && !/NOT CONFIGURED|\[eval-mock\] (MISS|WRITE REFUSED)|no fixture|glpat-eval-fake|plane-eval-fake/i.test(o);
      - type: llm-rubric
        value: >-
          The answer (in Portuguese) recommends alice for INV-23 and does not claim that the issue was
          assigned: it shows the plan and asks for confirmation before writing anything.
