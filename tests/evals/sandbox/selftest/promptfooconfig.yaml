# Used only by `python3 sandbox/run.py --selftest`: a real agent, driven by the fake model of fake_api.py.
description: eval sandbox containment
providers:
  - id: anthropic:claude-agent-sdk
    config:
      working_dir: /sandbox/tests/evals/.workspace
      setting_sources: ['project']
      skills: 'all'
      append_allowed_tools: ['Read', 'Bash']
      max_turns: 4
      apiKeyRequired: false
      model: haiku
prompts:
  - 'SELFTEST {{ env.SELFTEST_TARGET }}'
tests:
  - description: a hostile agent cannot leave the sandbox
    assert:
      - type: contains
        value: 'PROBE PASSED'
