# APM package: the hackathon deliverable.
# Portable agent skills that turn GitLab data (Jira / Plane coming) into engineering KPIs.
# Skills follow the open Agent Skills format, so APM deploys them for Claude Code
# (.claude/skills/), GitHub Copilot and OpenCode (.agents/skills/).
#
# MCP servers are NOT declared under dependencies.mcp on purpose: the skills need
# the GitLab MCP server, but every team runs its own GitLab (different URL), and
# APM only accepts a literal `url` for self-defined servers (no ${VAR} or
# ${input:...} there; placeholders work only in headers/env). An installable
# package must not hardcode one team's URL, so the setup wizard
# (scripts/setup-mcp.sh or /setup-mcp) declares the server in the consumer's own
# apm.yml with the right URL and auth.
name: hackathon-metrics
version: 0.3.0
description: GitLab repository KPIs and milestone forecasts as portable agent skills (Claude Code, GitHub Copilot, OpenCode) over the GitLab MCP server
license: MIT
includes: auto

scripts:
  # Lets the package author run the wizard from this directory: apm run setup
  setup: "bash scripts/setup-mcp.sh"

dependencies:
  apm: []
  mcp: []
